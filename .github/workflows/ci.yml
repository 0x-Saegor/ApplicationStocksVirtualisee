name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-clients:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clients_database
          MYSQL_USER: carpart
          MYSQL_PASSWORD: carpart
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: carpart
      MYSQL_PASSWORD: carpart
      MYSQL_DATABASE: clients_database
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clients/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Lancement de l'API
        run: |
          nohup uvicorn main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/docs > /dev/null && exit 0
            sleep 1
          done
          cat api.log
          exit 1

      - name: Tests
        run: |
          API=http://localhost:8000
          id=$(curl -sf -X POST $API/client -H "Content-Type: application/json" \
            -d '{"nom":"Durand","prenom":"Marie","email":"marie.durand@mail.com","nb_commande":3}' | jq -r .id)
          curl -sf $API/clients | jq -e "map(.id) | index($id) != null"
          curl -sf $API/client/$id | jq -e '.email == "marie.durand@mail.com"'
          curl -sf -X PUT $API/client/$id -H "Content-Type: application/json" \
            -d '{"nom":"Durand","prenom":"Marie","email":"marie.durand@mail.com","nb_commande":4}'
          curl -sf $API/client/$id | jq -e '.nb_commande == 4'
          curl -sf -X DELETE $API/client/$id
          test "$(curl -s -o /dev/null -w '%{http_code}' $API/client/$id)" = "404"

      - name: Logs
        if: always()
        run: cat api.log

  test-stock:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGO_URL: mongodb://localhost:27017/
    defaults:
      run:
        working-directory: stock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Lancement de l'API
        run: |
          nohup uvicorn main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/docs > /dev/null && exit 0
            sleep 1
          done
          cat api.log
          exit 1

      - name: Tests
        run: |
          API=http://localhost:8000
          id=$(curl -sf -X POST $API/product -H "Content-Type: application/json" \
            -d '{"nom":"Clavier","description":"Clavier mecanique","quantite":10,"prix":49.99}' | jq -r .id)
          curl -sf $API/products | jq -e --arg id "$id" 'map(._id) | index($id) != null'
          curl -sf $API/product/description/$id | jq -e '.description == "Clavier mecanique"'
          curl -sf -X PUT $API/product/$id -H "Content-Type: application/json" \
            -d '{"nom":"Clavier","description":"Clavier sans fil","quantite":5,"prix":59.99}'
          curl -sf $API/product/description/$id | jq -e '.description == "Clavier sans fil"'
          curl -sf -X DELETE $API/product/$id
          test "$(curl -s -o /dev/null -w '%{http_code}' $API/product/description/$id)" = "404"

      - name: Logs
        if: always()
        run: cat api.log

  # build buildah -> registry github
  buildah:
    needs: [test-clients, test-stock]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [clients, stock]
    steps:
      - uses: actions/checkout@v4

      # ghcr veut des minuscules
      - run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: carpart-${{ matrix.app }}
          tags: latest ${{ github.sha }}
          context: ./${{ matrix.app }}
          containerfiles: ./${{ matrix.app }}/Dockerfile

      - name: Push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # build docker -> docker hub
  docker:
    needs: [test-clients, test-stock]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [clients, stock]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/carpart-${{ matrix.app }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/carpart-${{ matrix.app }}:${{ github.sha }}
